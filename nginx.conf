server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota cai no index.html (como o rewrite da Vercel)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets cacheados (hash no nome permite cache longo)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
